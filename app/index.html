<title>起業司令室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column "指令書" (order sheet) app, phone-first; fixed tab bar at the bottom; done tasks get a vermilion 済 seal. */
:root {
  --bg: #ECEFEA;
  --surface: #FAFBF8;
  --sunk: #E2E6E0;
  --ink: #18212C;
  --muted: #5B6672;
  --line: #D2D8D1;
  --accent: #2443A6;
  --accent-soft: #DCE3F7;
  --seal: #C6361D;
  --ok: #2C7A4D;
  --warn: #A86E12;
  /* income series, fixed order: AI, バイト, その他 */
  --s-ai: #2a78d6;
  --s-baito: #eb6834;
  --s-other: #1baf7a;
  --f-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151B; --surface: #19212A; --sunk: #131A21; --ink: #E5E9ED; --muted: #98A2AD;
    --line: #2A343F; --accent: #8EA5FF; --accent-soft: #24304F; --seal: #FF6B4E; --ok: #5DC58C; --warn: #E2AA4C;
    --s-ai: #3987e5; --s-baito: #d95926; --s-other: #199e70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151B; --surface: #19212A; --sunk: #131A21; --ink: #E5E9ED; --muted: #98A2AD;
  --line: #2A343F; --accent: #8EA5FF; --accent-soft: #24304F; --seal: #FF6B4E; --ok: #5DC58C; --warn: #E2AA4C;
  --s-ai: #3987e5; --s-baito: #d95926; --s-other: #199e70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
.view { display: grid; gap: 18px; min-width: 0; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 13px; letter-spacing: .12em; color: var(--muted); }
.date-big { font-family: var(--f-display); font-size: clamp(40px, 11vw, 56px); line-height: 1; letter-spacing: -.01em; }
.date-big small { font-family: var(--f-body); font-weight: 700; font-size: 16px; letter-spacing: 0; margin-left: 8px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.baito { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.full { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.chip.ai { background: var(--accent-soft); color: var(--accent); }

h2 { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; font-weight: 700; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

/* buttons */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: progress; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* progress */
.meter { display: grid; gap: 6px; }
.meter-bar { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.meter-text { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* order sheet tasks */
.orders { list-style: none; margin: 0; padding: 0; }
.order { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: start; padding: 14px 16px; border-top: 1px dashed var(--line); position: relative; }
.order:first-child { border-top: 0; }
.check { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; padding: 0; position: relative; }
.check:hover { border-color: var(--seal); }
.seal { position: absolute; inset: -3px; border: 2.5px solid var(--seal); border-radius: 50%; color: var(--seal); font-family: var(--f-display); font-size: 17px; display: grid; place-items: center; transform: rotate(-14deg); opacity: 0; scale: 1.6; transition: opacity .18s ease, scale .22s cubic-bezier(.3,1.6,.5,1); background: color-mix(in srgb, var(--seal) 8%, var(--surface)); }
.order.done .seal { opacity: 1; scale: 1; }
.order.done .o-title { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--seal) 60%, transparent); }
.o-body { min-width: 0; display: grid; gap: 4px; }
.o-title { font-weight: 700; line-height: 1.45; }
.o-detail { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.o-meta { display: grid; justify-items: end; gap: 4px; }
.min { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.cat { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor; }
.cat-info { color: var(--accent); } .cat-learn { color: var(--ok); } .cat-work { color: var(--seal); }
.cat-post { color: var(--warn); } .cat-log, .cat-review { color: var(--muted); }
.o-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: 12px; cursor: pointer; }

.coach { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.notice { font-size: 13px; color: var(--muted); background: var(--sunk); padding: 10px 12px; border-radius: 8px; }

/* forms */
label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
input[type=text], input[type=time], input[type=date], input[type=number], textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; font-size: 15px; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.moods { display: flex; gap: 6px; }
.mood { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--f-mono); font-weight: 700; }
.mood[aria-pressed=true] { background: var(--accent); color: var(--surface); border-color: var(--accent); }

/* brief */
.platform { display: grid; gap: 0; }
.platform-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.ptag { font-family: var(--f-mono); font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--ink); color: var(--surface); }
.item { padding: 14px 16px; border-top: 1px dashed var(--line); display: grid; gap: 6px; min-width: 0; }
.item:first-of-type { border-top: 0; }
.item h4 { margin: 0; font-size: 15px; line-height: 1.45; }
.item p { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.chance { font-size: 13px; background: color-mix(in srgb, var(--ok) 12%, transparent); border-radius: 6px; padding: 6px 10px; }
.chance b { color: var(--ok); }
.src { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.datepills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.datepill { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-family: var(--f-mono); font-size: 12px; cursor: pointer; }
.datepill[aria-pressed=true] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.headline { font-family: var(--f-display); font-size: 22px; line-height: 1.35; text-wrap: balance; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cal .wd.sun { color: var(--seal); } .cal .wd.sat { color: var(--accent); }
.day { aspect-ratio: 1 / 1.5; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 4px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 2px; cursor: pointer; text-align: left; min-width: 0; overflow: hidden; }
.day.out { opacity: .35; }
.day.today { border-color: var(--accent); border-width: 2px; }
.day[aria-pressed=true] { background: var(--accent-soft); }
.day .n { font-family: var(--f-mono); font-size: 13px; font-weight: 700; }
.day .marks { overflow: hidden; min-height: 14px; display: flex; gap: 2px; flex-wrap: wrap; align-content: start; }
.day .mk { font-size: 9px; font-weight: 700; padding: 0 3px; border-radius: 3px; background: var(--sunk); color: var(--muted); line-height: 1.5; }
.day .mk.b { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.day .rate { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.day .rate i { display: block; height: 100%; background: var(--seal); }
.ev { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.ev:first-child { border-top: 0; }
.ev .t { font-family: var(--f-mono); font-size: 13px; white-space: nowrap; }

/* tabs inside a view */
.seg { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 10px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 7px; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }

.list { display: grid; gap: 0; }
.li { padding: 12px 16px; border-top: 1px dashed var(--line); display: grid; gap: 4px; min-width: 0; }
.li:first-child { border-top: 0; }
.li .top-line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.li p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }

/* growth */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 320px; height: auto; }
.phase { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--line); }
.phase:first-child { border-top: 0; }
.phase .wk { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.phase.now .wk { color: var(--seal); font-weight: 700; }
.phase.now h3::after { content: "いまここ"; margin-left: 8px; font-size: 11px; color: var(--surface); background: var(--seal); padding: 1px 6px; border-radius: 4px; vertical-align: 2px; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.lesson { font-size: 12px; padding: 6px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.lesson.done { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ink); }
.lesson.next { outline: 2px solid var(--accent); background: var(--surface); color: var(--ink); }
.lesson .mono { font-size: 11px; }
.ai-out { white-space: pre-wrap; font-size: 14px; background: var(--sunk); border-radius: 8px; padding: 12px; overflow-wrap: anywhere; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }

/* research */
.seg.tight button { font-size: 12px; padding: 8px 2px; white-space: nowrap; }
.chips-ex { display: flex; gap: 6px; flex-wrap: wrap; }
.ex { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); text-align: left; }
.ex:hover { border-color: var(--accent); color: var(--accent); }
.badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; white-space: nowrap; }
.badge.quick { background: var(--sunk); color: var(--muted); }
.badge.queued { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.deep { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.conclusion { font-weight: 700; font-size: 16px; line-height: 1.55; text-wrap: pretty; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: 14px; }
.pts li { overflow-wrap: anywhere; }
.pts .s { font-size: 12px; margin-left: 4px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.tbl { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 13px; }
.tbl th, .tbl td { padding: 8px 10px; text-align: left; vertical-align: top; border-top: 1px solid var(--line); }
.tbl thead th { border-top: 0; background: var(--sunk); font-size: 12px; color: var(--muted); white-space: nowrap; }
.tbl td:first-child { font-weight: 700; }
.res-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px 16px; border-top: 1px dashed var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer; }
.res-row:first-child { border-top: 0; }
.res-row:hover, .res-row[aria-current=true] { background: var(--accent-soft); }
.res-row .q { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-row .c { grid-column: 1 / -1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fu { display: grid; gap: 4px; padding: 10px 0; border-top: 1px dashed var(--line); }
.fu:first-child { border-top: 0; }
.fu b { font-size: 13px; }

/* money */
.yen { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 10vw, 48px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.yen small { font-size: .5em; margin-right: 2px; }
.comp { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
.comp i { display: block; height: 100%; min-width: 0; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; }
.lg { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.lg .sw, .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.lg b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sw-ai { background: var(--s-ai); } .sw-baito { background: var(--s-baito); } .sw-other { background: var(--s-other); }
.brk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-top: 1px dashed var(--line); align-items: center; }
.brk:first-child { border-top: 0; }
.brk .lbl { display: flex; gap: 8px; align-items: center; min-width: 0; font-weight: 700; }
.brk .lbl span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brk .amt { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.brk .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.brk .bar i { display: block; height: 100%; border-radius: 3px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--sunk); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.kpi b { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.payline { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.day .amt { font-family: var(--f-mono); font-size: 9px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; letter-spacing: -.03em; }
.jobrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px dashed var(--line); }
.jobrow:first-child { border-top: 0; }
@media (max-width: 520px) { .jobrow { grid-template-columns: 1fr 1fr; } }
.cbx { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.nav a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 8px 2px 10px; font-size: 11px; font-weight: 700; }
.nav a .k { font-family: var(--f-display); font-size: 17px; line-height: 1.2; }
.nav a[aria-current=page] { color: var(--accent); }
.nav a[aria-current=page] .k { color: var(--seal); }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; z-index: 30; max-width: calc(100vw - 32px); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--ink); font-size: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div id="sync" class="notice" hidden></div>
  <main id="app" class="view"></main>
</div>
<nav class="nav" aria-label="画面の切り替え">
  <div class="nav-in">
    <a href="#today" data-v="today"><span class="k">令</span>今日</a>
    <a href="#brief" data-v="brief"><span class="k">報</span>朝刊</a>
    <a href="#research" data-v="research"><span class="k">調</span>調べる</a>
    <a href="#cal" data-v="cal"><span class="k">暦</span>予定</a>
    <a href="#notes" data-v="notes"><span class="k">帳</span>記録</a>
    <a href="#money" data-v="money"><span class="k">稼</span>収入</a>
    <a href="#growth" data-v="growth"><span class="k">伸</span>成長</a>
  </div>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ============ content: roadmap, practice pool, curriculum ============ */
const PHASES = [
  { w: [0, 1],   name: "基礎固め", goal: "AIツールを毎日触り、自分の作業で効果を体感する" },

/* ============ pay & income ============ */
function jobOf(ev) { const jobs = prof().jobs || []; return jobs.find((j) => j.id === ev.jobId) || jobs[0] || DEFAULT_PROFILE.jobs[0]; }
// 労働基準法34条: 6時間超で45分、8時間超で60分の休憩
const autoBreak = (span) => (span > 480 ? 60 : span > 360 ? 45 : 0);
function shiftPay(ev) {
  const job = jobOf(ev); const wage = +(ev.wage ?? job.wage) || 0;
  let s = toMin(ev.start), e = toMin(ev.end); if (e <= s) e += 1440;
  const span = e - s; const brk = ev.breakMin == null || ev.breakMin === "" ? autoBreak(span) : Math.max(0, +ev.breakMin);
  const mid = s + span / 2, b0 = mid - brk / 2, b1 = mid + brk / 2;
  let work = 0, night = 0, over = 0;
  for (let m = s; m < e; m++) {
    if (m >= b0 && m < b1) continue;
    work++; const t = m % 1440;
    if (t >= 1320 || t < 300) night++;      // 深夜 22:00–5:00 は25%増
    if (work > 480) over++;                 // 1日8時間を超えた分は25%増
  }
  const per = wage / 60;
  const base = Math.round(work * per);
  const nightX = job.night !== false ? Math.round(night * per * 0.25) : 0;
  const overX = Math.round(over * per * 0.25);
  const transport = +job.transport || 0;
  return { job, wage, work, brk, night, over, base, nightX, overX, transport, total: base + nightX + overX + transport };
}
function earningsFor(date) {
  const items = [];
  for (const ev of S.events.filter((e) => e.date === date && e.kind === "baito")) {
    const p = shiftPay(ev);
    items.push({ cat: "baito", label: p.job.name || "バイト", amount: p.total, pay: p, ev });
  }
  for (const r of S.income.filter((x) => x.date === date)) items.push({ cat: r.cat === "ai" ? "ai" : "other", label: r.source || INCOME_CAT[r.cat], amount: +r.amount || 0, rec: r });
  const sum = (c) => items.filter((i) => i.cat === c).reduce((a, i) => a + i.amount, 0);
  return { items, ai: sum("ai"), baito: sum("baito"), other: sum("other"), total: items.reduce((a, i) => a + i.amount, 0) };
}
function monthStats(ym) {
  const [y, m] = ym.split("-").map(Number); const n = new Date(y, m, 0).getDate();
  const out = { ai: 0, baito: 0, other: 0, total: 0, src: {}, aiHours: 0, aiWithHours: 0, workMin: 0, baitoPay: 0, days: [] };
  for (let d = 1; d <= n; d++) {
    const date = `${ym}-${pad(d)}`; const e = earningsFor(date);
    if (e.items.length) out.days.push({ date, ...e });
    for (const it of e.items) {
      out[it.cat] += it.amount; out.total += it.amount;
      const k = it.cat + "|" + it.label; out.src[k] = out.src[k] || { cat: it.cat, label: it.label, amount: 0, count: 0 };
      out.src[k].amount += it.amount; out.src[k].count++;
      if (it.cat === "baito") { out.workMin += it.pay.work; out.baitoPay += it.pay.base + it.pay.nightX + it.pay.overX; }
      if (it.cat === "ai" && +it.rec?.hours > 0) { out.aiHours += +it.rec.hours; out.aiWithHours += it.amount; }
    }
  }
  return out;
}

/* ============ store: artifact db, or this browser as a fallback ============ */
let db = null, sample = null;
const memory = {};
const listeners = {};
const queues = {};
const Store = {
  local: true,
  _read(coll) {
    if (memory[coll]) return memory[coll];
    let o = {};
    try { o = JSON.parse(localStorage.getItem("kc:" + coll) || "{}"); } catch { o = {}; }
    return (memory[coll] = o);
  },
  _emit(coll) { const o = this._read(coll); listeners[coll]?.(Object.entries(o).map(([id, v]) => ({ id, ...v })), true); },
  watch(coll, cb) {
    if (!this.local) {
      return db.collection(coll).onSnapshot(
        (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() })), !s.metadata.fromCache),
        (e) => { console.warn(coll, e); showSync("データに接続できませんでした。ページを開き直してください。"); }
      );
    }
    listeners[coll] = cb; this._emit(coll); return () => {};
  },
  put(coll, id, data) {
    if (!this.local) {
      const key = coll + "/" + id;
      queues[key] = (queues[key] || Promise.resolve()).then(() => db.collection(coll).doc(id).set(data)).catch((e) => {
        console.warn(e); toast(e?.code === "quota_exceeded" ? "保存容量がいっぱいです。古い記録を削除してください" : "保存できませんでした。もう一度お試しください");
      });
      return queues[key];
    }
    const o = this._read(coll); o[id] = data;
    try { localStorage.setItem("kc:" + coll, JSON.stringify(o)); } catch {}
    this._emit(coll); return Promise.resolve();
  },
  // merge a few fields into an existing doc (so a write from the page never wipes fields Claude added)
  patch(coll, id, data) {
    if (!this.local) {
      const key = coll + "/" + id;
      queues[key] = (queues[key] || Promise.resolve()).then(() => db.collection(coll).doc(id).update(data)).catch((e) => { console.warn(e); toast("保存できませんでした。もう一度お試しください"); });
      return queues[key];
    }
    const o = this._read(coll); o[id] = { ...(o[id] || {}), ...data };
    try { localStorage.setItem("kc:" + coll, JSON.stringify(o)); } catch {}
    this._emit(coll); return Promise.resolve();
  },
  del(coll, id) {
    if (!this.local) {
      const key = coll + "/" + id;
      queues[key] = (queues[key] || Promise.resolve()).then(() => db.collection(coll).doc(id).delete()).catch(() => toast("削除できませんでした"));
      return queues[key];
    }
    const o = this._read(coll); delete o[id];
    try { localStorage.setItem("kc:" + coll, JSON.stringify(o)); } catch {}
    this._emit(coll); return Promise.resolve();
  },
};

  }).filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
  let busy = 0, cur = null;

  if (cur) busy += cur[1] - cur[0];
  const free = Math.max(0, we - ws - busy);
  const baito = mine.some((e) => e.kind === "baito");
  let budget = baito ? Math.round(free * 0.35) : (free >= 600 ? 300 : Math.round(free * 0.5));

function phaseIndex(date) { const w = Math.floor(Math.max(0, daysBetween(startDate(), date)) / 7); return Math.max(0, PHASES.findIndex((p) => w >= p.w[0] && w <= p.w[1])); }
function doneKeys(exceptDate) {
  const set = new Set();

}

}
function candidates(date) {
  const ph = phaseIndex(date); const done = doneKeys(date);

function briefFor(date) { return S.briefs.find((b) => b.id === date); }
function buildPlan(date, evs) {
  const fr = freeInfo(date, evs); const brief = briefFor(date);
  const short = fr.budget < 90;
  const li = lessonIndexFor(date); const L = LESSONS[li % LESSONS.length];
  const post = brief?.postIdeas?.[0];
  const tasks = [
    { key: "brief", cat: "info", min: 10, title: "朝刊を読み、事業アイデアを1つアイデア帳に保存する",
      detail: brief?.todayFocus ? "今日の注目：" + brief.todayFocus : "「朝刊」のトレンドから、お金になりそうな困りごとを1つ選ぶ" },
    { key: "lesson-" + li, cat: "learn", min: short ? 15 : L.m, lesson: li, title: `学習 #${li + 1}　${L.t}`,
      detail: "調べて要点を3つにまとめ、一言日記に書く。「AIに教わる」で解説も読めます" + (short ? "（今日は15分の短縮版でOK）" : "") },
    { key: "post", cat: "post", min: short ? 10 : 20, title: "SNSに1本投稿する",
      detail: post ? `案（${post.platform}）：${post.text}` : "今日学んだこと・作ったものを発信する。「記録 › 発信」で下書きを作れます" },
    { key: "diary", cat: "log", min: 5, title: "一言日記を書く", detail: "今日の気づきを一行で。翌日のタスクに活かします" },
  ];
  if (parseYmd(date).getDay() === 0) tasks.push({ key: "review-" + weekKey(date), cat: "review", min: 20, title: "今週の振り返りを書く", detail: "「成長」の週の振り返りに、良かったこと・課題・来週やることを書く" });
  let remain = fr.budget - tasks.reduce((a, t) => a + t.min, 0);

    else if (remain >= 30) { tasks.splice(2, 0, { key: c.id, cat: "work", min: remain, partial: true, title: `${c.t}（${remain}分だけ進める）`, detail: c.d }); remain = 0; }

}

async function aiRebuild(date) {
  if (!sample || S.busy.rebuild) return;
  S.busy.rebuild = true; render();
  const doc = dayView(date); const fr = freeInfo(date, S.events); const brief = briefFor(date);
  const done = doc.tasks.filter((t) => t.done);
  const li = lessonIndexFor(date);
  const recent = Array.from({ length: 7 }, (_, i) => addDays(date, -7 + i)).map((d) => `${d}:${Math.round(rateOf(S.days[d]) * 100)}%`).join(", ");
  const diary = Object.values(S.diary).sort((a, b) => (a.id < b.id ? 1 : -1)).slice(0, 3).map((d) => `${d.id} ${d.text}`).join(" / ");
  const evs = S.events.filter((e) => e.date === date).map((e) => `${e.start}-${e.end} ${e.title}`).join(", ") || "なし";
  const prompt = `あなたはAIで起業を目指す人の専属コーチです。本人は「AIの犬になってタスクを消化する」と決めているので、具体的で迷わない指令を出してください。
今日のタスクを組み直し、JSONだけを返してください。

最終目標: ${prof().goal}
現在のフェーズ: ${PHASES[phaseIndex(date)].name}（${PHASES[phaseIndex(date)].goal}）
日付: ${date}（${WD[parseYmd(date).getDay()]}）
今日の予定: ${evs}
自由時間: ${fmtMin(fr.free)} / 作業の目安: ${fr.budget}分
完了済み（含めない）: ${done.map((t) => t.title).join(" / ") || "なし"}
今日の学習テーマ: #${li + 1} ${LESSONS[li % LESSONS.length].t}（key: lesson-${li}）
実践タスクの候補（使うときは key をそのまま使う）: ${JSON.stringify(candidates(date).slice(0, 8).map((c) => ({ key: c.id, title: c.t, min: c.m })))}
朝刊の注目: ${brief?.todayFocus || "なし"}
最近7日の達成率: ${recent}
最近の日記: ${diary || "なし"}

ルール:
- key "brief"（朝刊を読みアイデアを1つ保存）、key "lesson-${li}"（学習）、key "post"（SNS投稿1本）、key "diary"（一言日記）は必ず含める
- 実践タスクは候補から選ぶ。候補にない独自タスクは key を "custom-1" のようにする
- 未完了タスクの合計分数を作業目安（${fr.budget}分）以内にする
- 達成率が低い日が続いていれば量を減らし、高ければ少し攻める
- detail には「何をどこまでやれば完了か」を1〜2文で書く

形式: {"comment":"40字以内の一言（厳しめだが前向き）","tasks":[{"key":"","title":"","detail":"","min":30,"cat":"info|learn|work|post|log|review"}]}`;
  try {
    const out = await sample.json(prompt, { modelTier: "default" });
    const list = Array.isArray(out?.tasks) ? out.tasks : [];
    if (!list.length) throw new Error("empty");
    const keys = new Set(done.map((t) => t.key));
    const fresh = list.filter((t) => t && t.title && !keys.has(t.key)).map((t, i) => {
      const key = String(t.key || "custom-" + i).slice(0, 40);
      return { id: key, key, done: false, title: String(t.title).slice(0, 120), detail: String(t.detail || "").slice(0, 300),
        min: Math.max(5, Math.min(240, +t.min || 30)), cat: CAT[t.cat] ? t.cat : "work", ...(key.startsWith("lesson-") ? { lesson: li } : {}) };
    });
    const next = { ...doc, tasks: [...done, ...fresh], generatedBy: "ai", aiComment: String(out.comment || "").slice(0, 80), updatedAt: Date.now() };
    S.days[date] = next; await Store.put("days", date, next);
    toast("AIがタスクを組み直しました");
  } catch (e) {
    toast(e?.code === "not_granted" ? "AIの利用が許可されていません" : e?.code === "rate_limited" ? "AIの利用上限に達しました。しばらくしてからお試しください" : "AIで組み直せませんでした");

}
async function aiText(slot, prompt) {
  if (!sample || S.busy[slot]) return null;
  S.busy[slot] = true; S.aiOut[slot] = "考えています…"; render();

    const r = await sample(prompt, { onText: ({ text }) => { S.aiOut[slot] = text; const el = document.querySelector(`[data-ai-out="${slot}"]`); if (el) el.textContent = text; } });

}

function normRes(o) {

  const t = o.table && Array.isArray(o.table.cols) && Array.isArray(o.table.rows) && o.table.rows.length

function chart6(ym) {

  const top = Math.ceil(max / step) * step;
  const W = 560, H = 210, L = 52, B = 26, T = 14, R = 8; const cw = (W - L - R) / 6;
  const yv = (v) => T + (H - T - B) * (1 - v / top);

  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近6か月の収入の推移（AI・バイト・その他）">${ticks}${cols}</svg>`;

function statsSummary() {
  const t = today();
  const doneTotal = Object.values(S.days).reduce((a, d) => a + (d.tasks || []).filter((x) => x.done).length, 0);
  let streak = 0; let cur = rateOf(S.days[t]) >= 0.7 ? t : addDays(t, -1);
  while (S.days[cur] && rateOf(S.days[cur]) >= 0.7) { streak++; cur = addDays(cur, -1); }
  const last7 = Array.from({ length: 7 }, (_, i) => S.days[addDays(t, -6 + i)]).filter(Boolean);
  const avg7 = last7.length ? last7.reduce((a, d) => a + rateOf(d), 0) / last7.length : 0;
  return { doneTotal, streak, avg7 };
}

document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; const ds = el.dataset;
  if (a === "toggle") {
    const doc = dayView(ds.date); const t = doc.tasks.find((x) => x.key === ds.key);
    if (t) { setTaskDone(ds.date, ds.key, !t.done); if (!t.done) toast("判子を押しました"); render(); }
  } else if (a === "replan") { await savePlan(ds.date); toast("空き時間に合わせて組み直しました"); render(); }
  else if (a === "ai-rebuild") aiRebuild(ds.date);
  else if (a === "goto-day") { S.selDate = ds.date; }
  else if (a === "teach") {
    const L = LESSONS[+ds.lesson % LESSONS.length];
    aiText("teach-" + ds.lesson, `AIで業務効率化の代行サービスを始めたい初心者に、「${L.t}」を教えてください。日本語で、要点3つ、具体例1つ、今日5分でできる実践1つを、合計400字程度で。見出し記号は使わず、短い段落で。`);
  }
  else if (a === "mood") { S.draftMood = +ds.m; render(); }
  else if (a === "save-diary") {
    const text = ($("#diary-text")?.value || "").trim(); if (!text) { toast("一言だけでも書いてください"); return; }
    const d = ds.date; const doc = { text, mood: S.draftMood ?? S.diary[d]?.mood ?? 0, updatedAt: Date.now() };
    S.diary[d] = { id: d, ...doc }; await Store.put("diary", d, doc);
    S.draftDiary = null; S.draftMood = null;
    if (!S.days[d]) await savePlan(d);
    setTaskDone(d, "diary", true); toast("日記を保存しました"); render();
  }
  else if (a === "brief-date") { S.briefDate = ds.date; render(); }
  else if (a === "res-kind") { S.resKind = ds.k; ls("kc:resKind", ds.k); render(); }
  else if (a === "res-ex") { S.resQ = ds.t; render(); const q = $("#res-q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  else if (a === "res-sel") { S.resSel = ds.id || null; S.resFu = ""; S.resDelArm = null; render(); if (ds.id) window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (a === "res-run") {
    const q = ($("#res-q")?.value || "").trim(); if (!q) { toast("知りたいことを入力してください"); return; }
    const web = !!$("#res-web")?.checked || !sample; ls("kc:resWeb", $("#res-web")?.checked ? "1" : "0");
    const id = uid(); const doc = { q: q.slice(0, 300), kind: RES_KINDS[S.resKind] ? S.resKind : "market", status: web ? "queued" : "quick", quick: null, deep: null, followups: [], createdAt: Date.now(), updatedAt: Date.now(), ...(web ? { queuedAt: Date.now() } : {}) };
    S.research = [{ id, ...doc }, ...S.research]; S.resSel = id; S.resQ = "";
    await Store.put("research", id, doc);
    if (web) toast(sample ? "AIが答えます。Webでの裏取りも予約しました" : "Webでの調査を予約しました");
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
    if (sample) aiResearch(id);
  }
  else if (a === "res-retry") aiResearch(ds.id);
  else if (a === "res-deep") { await Store.patch("research", ds.id, { status: "queued", queuedAt: Date.now(), updatedAt: Date.now() }); toast("Webでの裏取りを予約しました。終わったら通知します"); }
  else if (a === "res-follow") { const q = ($("#res-fu")?.value || "").trim(); if (!q) { toast("質問を入力してください"); return; } aiFollow(ds.id, q); }
  else if (a === "res-del") {
    if (S.resDelArm !== ds.id) { S.resDelArm = ds.id; render(); return; }
    S.resDelArm = null; await Store.del("research", ds.id); S.resSel = null; toast("削除しました"); render();
  }
  else if (a === "res-idea") {
    const r = S.research.find((x) => x.id === ds.id); const m = r?.deep || r?.quick; if (!m) return;
    const url = (m.points || []).find((p) => safeUrl(p.url))?.url || (m.sources || []).find((s) => safeUrl(s.url))?.url || "";
    await addIdea({ title: m.chance || r.q, memo: `${r.q}\n${m.conclusion}`, from: `調べ物 · ${RES_KINDS[r.kind]?.label || ""}`, url: safeUrl(url) });
  }
  else if (a === "save-idea-from") {
    const b = S.briefs.find((x) => x.id === ds.b); const it = b?.sections?.find((s) => s.key === ds.s)?.items?.[+ds.i]; if (!it) return;
    await addIdea({ title: it.chance || it.title, memo: it.chance ? it.title : (it.summary || ""), from: `朝刊 ${ds.b.slice(5).replace("-", "/")} · ${SECTIONS.find((x) => x[0] === ds.s)?.[1] || ""}`, url: safeUrl(it.url) });
  }
  else if (a === "add-idea") {
    const title = ($("#idea-title")?.value || "").trim(); if (!title) { toast("アイデアを入力してください"); return; }
    await addIdea({ title, memo: ($("#idea-memo")?.value || "").trim() });
  }
  else if (a === "del-idea") { await Store.del("ideas", ds.id); toast("削除しました"); }
  else if (a === "copy") {
    try { await navigator.clipboard.writeText(ds.text); toast("コピーしました"); } catch { toast("コピーできませんでした。長押しで選択してください"); }
  }
  else if (a === "draft-from") {
    const b = S.briefs.find((x) => x.id === ds.b); const p = b?.postIdeas?.[+ds.i]; if (!p) return;
    await Store.put("posts", uid(), { platform: p.platform, text: p.text, posted: false, createdAt: Date.now() }); toast("下書きに追加しました");
  }
  else if (a === "notes-tab") { S.notesTab = ds.t; ls("kc:notesTab", ds.t); render(); }
  else if (a === "add-post") {
    const text = ($("#post-text")?.value || "").trim(); if (!text) { toast("本文を入力してください"); return; }
    await Store.put("posts", uid(), { platform: $("#post-platform").value, text, posted: false, createdAt: Date.now() }); toast("下書きを保存しました");
  }
  else if (a === "posted") {
    const p = S.posts.find((x) => x.id === ds.id); if (!p) return; const { id, ...rest } = p;
    await Store.put("posts", id, { ...rest, posted: true, postedDate: today() });
    if (!S.days[today()]) await savePlan(today());
    setTaskDone(today(), "post", true); toast("投稿を記録しました"); render();
  }
  else if (a === "del-post") { await Store.del("posts", ds.id); toast("削除しました"); }
  else if (a === "ai-posts") {
    const b = briefFor(today()) || [...S.briefs].sort((x, y) => (x.id < y.id ? 1 : -1))[0];
    S.busy.posts = true; S.aiOut.posts = "考えています…"; render();
    try {
      const out = await sample.json(`AIで業務効率化の代行サービスを始める人のSNS投稿案を3つ作ってください。ターゲットは中小企業・個人事業主。役立つ・具体的・数字入りを重視。
今日のトレンド: ${b ? (b.headline || "") + " / " + (b.todayFocus || "") : "なし"}
最近学んだこと: ${Object.values(S.diary).sort((x, y) => (x.id < y.id ? 1 : -1)).slice(0, 3).map((d) => d.text).join(" / ") || "なし"}
媒体は X・Instagram・TikTok を1つずつ。TikTokは15秒の台本形式。
形式: {"posts":[{"platform":"X","text":""}]}`, { modelTier: "default" });
      for (const p of (out?.posts || []).slice(0, 3)) if (p?.text) await Store.put("posts", uid(), { platform: String(p.platform || "X").slice(0, 20), text: String(p.text).slice(0, 1200), posted: false, createdAt: Date.now(), ai: true });
      toast("投稿案を下書きに追加しました");
    } catch (err) { toast(err?.code === "rate_limited" ? "AIの利用上限に達しました" : "投稿案を作れませんでした"); }
    finally { S.busy.posts = false; render(); }
  }
  else if (a === "month") {
    const base = S.calMonth || today().slice(0, 7); const [y, m] = base.split("-").map(Number);
    S.calMonth = +ds.d === 0 ? today().slice(0, 7) : ymd(new Date(y, m - 1 + +ds.d, 1)).slice(0, 7); if (+ds.d === 0) S.selDate = today(); render();
  }
  else if (a === "pick") { S.selDate = ds.date; render(); }
  else if (a === "preset") { const j = (prof().jobs || [])[0]; await addEvent({ title: j?.name || "バイト", kind: "baito", start: ds.s, end: ds.e, jobId: j?.id || null }); }
  else if (a === "add-ev") {
    const kind = $("#ev-kind").value; const job = kind === "baito" ? (prof().jobs || []).find((j) => j.id === $("#ev-job")?.value) : null;
    const title = ($("#ev-title")?.value || "").trim() || (job?.name || (kind === "baito" ? "バイト" : "予定"));
    const start = $("#ev-start").value, end = $("#ev-end").value; if (!start || !end) { toast("開始と終了の時刻を入れてください"); return; }
    const extra = kind === "baito" ? { jobId: job?.id || null, wage: $("#ev-wage").value === "" ? null : +$("#ev-wage").value, breakMin: $("#ev-break").value === "" ? null : +$("#ev-break").value } : {};
    await addEvent({ title, kind, start, end, ...extra });
  }
  else if (a === "income-for") { S.incomeDate = ds.date; }
  else if (a === "mmonth") {
    const base = S.moneyMonth || today().slice(0, 7); const [y, m] = base.split("-").map(Number);
    S.moneyMonth = +ds.d === 0 ? today().slice(0, 7) : ymd(new Date(y, m - 1 + +ds.d, 1)).slice(0, 7); render();
  }
  else if (a === "add-income") {
    const amount = Math.round(+$("#in-amount").value || 0); const source = ($("#in-source").value || "").trim();
    if (!amount) { toast("金額を入れてください"); return; }
    if (!source) { toast("何で稼いだか（内容）を入れてください"); return; }
    const date = $("#in-date").value || today();
    await Store.put("income", uid(), { date, cat: $("#in-cat").value === "ai" ? "ai" : "other", source: source.slice(0, 60), client: ($("#in-client").value || "").trim().slice(0, 60),
      amount, hours: $("#in-hours").value === "" ? null : Math.max(0, +$("#in-hours").value), memo: ($("#in-memo").value || "").trim().slice(0, 200), createdAt: Date.now() });
    ["in-amount", "in-source", "in-client", "in-hours", "in-memo"].forEach((id) => { const el = $("#" + id); if (el) el.value = ""; });
    S.moneyMonth = date.slice(0, 7); toast(`${yen(amount)} を記録しました`); render();
  }
  else if (a === "del-income") { await Store.del("income", ds.id); toast("削除しました"); }
  else if (a === "add-job") {
    const p = readProfileForm(); p.jobs = [...(p.jobs || []), { id: "j" + uid(), name: "新しいバイト先", wage: 1100, transport: 0, night: true }];
    S.profile = p; await Store.put("config", "profile", p); render();
  }
  else if (a === "del-job") {
    const p = readProfileForm(); if ((p.jobs || []).length <= 1) { toast("バイト先は1つ以上必要です"); return; }
    p.jobs = p.jobs.filter((j) => j.id !== ds.id); S.profile = p; await Store.put("config", "profile", p); render();
  }
  else if (a === "del-ev") {
    const ev = S.events.find((x) => x.id === ds.id); if (!ev) return;
    const next = S.events.filter((x) => x.id !== ds.id); S.events = next;
    await Store.del("events", ds.id);
    if (ev.date >= today()) { await savePlan(ev.date, next); toast("予定を削除し、タスクを組み直しました"); } else toast("予定を削除しました");
    render();
  }
  else if (a === "save-review") {
    const wk = weekKey(today()); const cur = S.reviews[wk] || {};
    const doc = { ...strip(cur), good: $("#rv-good").value, bad: $("#rv-bad").value, next: $("#rv-next").value, updatedAt: Date.now() };
    S.reviews[wk] = { id: wk, ...doc }; await Store.put("reviews", wk, doc); S.draftRv = null;
    const sun = addDays(wk, 6); if (S.days[sun]) setTaskDone(sun, "review-" + wk, true);
    toast("振り返りを保存しました"); render();
  }
  else if (a === "ai-review") {
    const wk = weekKey(today()); const st = statsSummary();
    const week = Array.from({ length: 7 }, (_, i) => addDays(wk, i)).map((d) => { const doc = S.days[d]; return doc ? `${d}: ${doc.tasks.filter((t) => t.done).map((t) => t.title).join("、") || "完了なし"}（${Math.round(rateOf(doc) * 100)}%）` : `${d}: 記録なし`; }).join("\n");
    const text = await aiText("review", `あなたはAIで起業を目指す人の専属コーチです。本人は「AIの犬になってタスクを消化する」と決めています。今週の記録を講評し、来週の具体的な指令を3つ出してください。厳しめだが前向きに、日本語で350字程度。見出し記号は使わない。
目標: ${prof().goal}
フェーズ: ${PHASES[phaseIndex(today())].name}
連続達成: ${st.streak}日 / 直近7日平均: ${Math.round(st.avg7 * 100)}%
今週の完了タスク:
${week}
本人の振り返り: 良かった=${$("#rv-good")?.value || "未記入"} / 課題=${$("#rv-bad")?.value || "未記入"} / 来週=${$("#rv-next")?.value || "未記入"}
日記: ${Object.values(S.diary).filter((d) => d.id >= wk).map((d) => d.text).join(" / ") || "なし"}`);
    if (text) { const cur = S.reviews[wk] || {}; const doc = { ...strip(cur), aiFeedback: text, updatedAt: Date.now() }; S.reviews[wk] = { id: wk, ...doc }; await Store.put("reviews", wk, doc); render(); }
  }
  else if (a === "save-profile") {
    const p = readProfileForm();
    S.profile = p; await Store.put("config", "profile", p); await savePlan(today()); toast("設定を保存し、今日のタスクを組み直しました"); render();
  }
});
const strip = (o) => { const { id, ...r } = o || {}; return r; };
function readProfileForm() {
  const cur = prof(); const v = (id) => document.getElementById(id)?.value;
  const jobs = (cur.jobs || []).map((j) => ({
    id: j.id, name: (v("job-name-" + j.id) ?? j.name).trim() || "バイト",
    wage: Math.max(0, +(v("job-wage-" + j.id) ?? j.wage) || 0), transport: Math.max(0, +(v("job-tr-" + j.id) ?? j.transport) || 0),
    night: document.getElementById("job-n-" + j.id) ? document.getElementById("job-n-" + j.id).checked : j.night !== false,
  }));
  return { ...cur, jobs, goal: (v("pf-goal") ?? cur.goal).trim() || DEFAULT_PROFILE.goal, startDate: v("pf-start") || startDate(),
    dayStart: v("pf-ds") || cur.dayStart, dayEnd: v("pf-de") || cur.dayEnd, commute: Math.max(0, Math.min(180, +(v("pf-cm") ?? cur.commute) || 0)),
    aiTarget: Math.max(0, +(v("pf-ait") ?? cur.aiTarget) || 0) };
}
document.addEventListener("change", (e) => { if (e.target.id === "res-web") ls("kc:resWeb", e.target.checked ? "1" : "0"); if (e.target.id === "ev-kind") { const f = $("#baito-fields"); if (f) f.hidden = e.target.value !== "baito"; } });
async function addIdea({ title, memo = "", from = "", url = "" }) {
  await Store.put("ideas", uid(), { title: title.slice(0, 200), memo: memo.slice(0, 1000), from, url, date: today(), createdAt: Date.now() });
  if (!S.days[today()]) await savePlan(today());
  setTaskDone(today(), "brief", true); toast("アイデア帳に保存しました"); render();
}
async function addEvent({ title, kind, start, end, ...extra }) {
  const date = S.selDate; const ev = { date, title: title.slice(0, 60), kind, start, end, ...extra, createdAt: Date.now() };
  const id = uid(); S.events = [...S.events, { id, ...ev }];
  await Store.put("events", id, ev);
  if (date >= today()) { await savePlan(date, S.events); toast("予定を追加し、タスクを組み直しました"); } else toast("予定を追加しました");
  const t = $("#ev-title"); if (t) t.value = "";
  render();
}

/* ============ routing + boot ============ */
const VIEWS = ["today", "brief", "research", "cal", "notes", "money", "growth"];
function route() { const h = location.hash.slice(1); S.view = VIEWS.includes(h) ? h : "today"; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);

function subscribe() {
  Store.watch("config", (rows, fresh) => { S.profile = rows.find((r) => r.id === "profile") ? strip(rows.find((r) => r.id === "profile")) : null; if (fresh) S.loaded.profile = true; maybeAutoPlan(); render(); });
  Store.watch("days", (rows, fresh) => { S.days = Object.fromEntries(rows.map((r) => [r.id, r])); if (fresh) S.loaded.days = true; maybeAutoPlan(); render(); });
  Store.watch("events", (rows, fresh) => { S.events = rows; if (fresh) S.loaded.events = true; maybeAutoPlan(); render(); });
  Store.watch("briefs", (rows) => { S.briefs = rows; render(); });
  Store.watch("ideas", (rows) => { S.ideas = rows; render(); });
  Store.watch("diary", (rows) => { S.diary = Object.fromEntries(rows.map((r) => [r.id, r])); render(); });
  Store.watch("posts", (rows) => { S.posts = rows; render(); });
  Store.watch("reviews", (rows) => { S.reviews = Object.fromEntries(rows.map((r) => [r.id, r])); render(); });
  Store.watch("income", (rows) => { S.income = rows; render(); });
  Store.watch("research", (rows) => { S.research = rows; render(); });
}
async function boot() {
  route();
  if (window.claude?.use) {
    showSync("データを読み込んでいます…");
    const timer = setTimeout(() => showSync("データにまだ接続できません。電波の良い場所で開き直してください。"), 10000);
    try { db = await window.claude.use("db"); } catch { db = null; }
    try { sample = await window.claude.use("sample"); } catch { sample = null; }
    clearTimeout(timer);
    Store.local = !db;
    showSync(db ? "" : "この表示ではデータを共有保存できないため、このブラウザの中に保存します。");
  }
  subscribe();
  // refresh "today" at midnight / when returning to the app
  let lastDay = today();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); autoPlanned = false; S.selDate = today(); maybeAutoPlan(); render(); } });
}
boot();
</script>
