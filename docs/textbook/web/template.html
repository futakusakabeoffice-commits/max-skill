<title>Claude Code の教科書</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: textbook with a fixed chapter index on the left (drawer on phones) and a single reading column at ~68ch. */
:root {
  --bg: #f6f8f7;
  --paper: #ffffff;
  --ink: #1d2a26;
  --ink-soft: #4e5f59;
  --line: #dbe3e0;
  --brand: #2e7d6b;
  --brand-ink: #ffffff;
  --brand-tint: #e5f1ed;
  --warn: #9a5a12;
  --warn-tint: #fbf1e2;
  --code-bg: #eef3f1;
  --mark: #fff0a8;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-head: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side-w: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --paper: #18201d; --ink: #e3ebe8; --ink-soft: #a3b3ad; --line: #2c3834;
    --brand: #5fbfa6; --brand-ink: #0d1412; --brand-tint: #1c2f29; --warn: #e6a95a; --warn-tint: #2c2418;
    --code-bg: #0f1513; --mark: #5a4d12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --paper: #18201d; --ink: #e3ebe8; --ink-soft: #a3b3ad; --line: #2c3834;
  --brand: #5fbfa6; --brand-ink: #0d1412; --brand-tint: #1c2f29; --warn: #e6a95a; --warn-tint: #2c2418;
  --code-bg: #0f1513; --mark: #5a4d12; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.85; }
a { color: var(--brand); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: none; align-items: center; gap: 12px;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.topbar .t { font-family: var(--font-head); font-weight: 700; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--paper); border-right: 1px solid var(--line);
  padding: 24px 16px 40px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; text-decoration: none; color: var(--ink); }
.brand .k { font-family: var(--font-head); font-weight: 900; font-size: 22px; letter-spacing: .02em; line-height: 1.3; }
.brand .k span { color: var(--brand); }
.brand .s { font-size: 12px; color: var(--ink-soft); }
.search { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); margin-bottom: 8px; }
.progress { font-size: 12px; color: var(--ink-soft); margin: 4px 0 14px; display: flex; flex-direction: column; gap: 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .3s; }
.part { font-family: var(--font-head); font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--ink-soft); margin: 18px 0 6px; }
nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
nav a { display: grid; grid-template-columns: 2.2em 1fr auto; align-items: baseline; gap: 4px; padding: 6px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.5; }
nav a:hover { background: var(--bg); }
nav a.cur { background: var(--brand-tint); color: var(--ink); font-weight: 700; }
nav a .n { color: var(--brand); font-family: var(--font-head); font-weight: 700; font-variant-numeric: tabular-nums; }
nav a .ck { font-size: 12px; color: var(--brand); }
.results { display: flex; flex-direction: column; gap: 6px; }
.results a { display: block; padding: 8px; border-radius: 8px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: 13px; line-height: 1.55; }
.results a b { display: block; font-family: var(--font-head); color: var(--brand); font-size: 13px; }
.results mark { background: var(--mark); color: inherit; }
.results .none { font-size: 13px; color: var(--ink-soft); }

main { min-width: 0; padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
article { max-width: 72ch; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 40px clamp(18px, 5vw, 56px) 48px; }
.eyebrow { font-family: var(--font-head); font-size: 13px; font-weight: 700; color: var(--brand); letter-spacing: .1em; margin-bottom: 6px; }
article h1 { font-family: var(--font-head); font-weight: 900; font-size: clamp(26px, 4.2vw, 34px); line-height: 1.35; margin: 0 0 20px; text-wrap: balance; }
article h2 { font-family: var(--font-head); font-weight: 700; font-size: 22px; line-height: 1.45; margin: 48px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--brand-tint); text-wrap: balance; scroll-margin-top: 72px; }
article h3 { font-family: var(--font-head); font-weight: 700; font-size: 18px; margin: 32px 0 10px; scroll-margin-top: 72px; }
article h4 { font-family: var(--font-head); font-size: 16px; margin: 24px 0 8px; }
article p, article li { overflow-wrap: anywhere; }
article ul, article ol { padding-left: 1.4em; }
article li { margin: 4px 0; }
article hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }
article strong { font-weight: 700; }
article img { max-width: 100%; }
[id] { scroll-margin-top: 72px; }

article code { font-family: var(--font-code); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 5px; overflow-wrap: anywhere; }
.code { position: relative; margin: 16px 0; }
.code pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; line-height: 1.6; }
.code pre code { background: none; padding: 0; font-size: 13.5px; overflow-wrap: normal; white-space: pre; }
.code .lang { position: absolute; top: 0; left: 12px; transform: translateY(-50%); font-family: var(--font-code); font-size: 11px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; color: var(--ink-soft); }
.code .copy { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 3px 9px; opacity: .85; }

.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.65; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { background: var(--brand-tint); font-family: var(--font-head); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

blockquote { margin: 18px 0; padding: 12px 16px; border-left: 4px solid var(--line); background: var(--bg); border-radius: 0 10px 10px 0; }
blockquote > :first-child { margin-top: 0; } blockquote > :last-child { margin-bottom: 0; }
blockquote.goals { border: 1px solid var(--brand); border-left-width: 1px; border-radius: 12px; background: var(--brand-tint); padding: 16px 20px; }
blockquote.warn { border-left-color: var(--warn); background: var(--warn-tint); }
blockquote.warn strong:first-child { color: var(--warn); }

details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 8px 0 20px; background: var(--bg); }
details summary { cursor: pointer; color: var(--brand); font-weight: 700; font-size: 14px; }
details[open] summary { margin-bottom: 8px; }

.done-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); }
.done-row .hint { font-size: 13px; color: var(--ink-soft); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 72ch; margin: 18px auto 0; }
.pager a { flex: 1 1 220px; min-width: 0; text-decoration: none; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 16px; color: var(--ink); font-size: 14px; }
.pager a small { display: block; color: var(--ink-soft); font-size: 12px; }
.pager a.next { text-align: right; }
.pager a:hover { border-color: var(--brand); }
.scrim { display: none; }

@media (max-width: 900px) {
  .topbar { display: flex; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; z-index: 40; inset: 0 auto 0 0; width: min(86vw, 320px); height: 100%; transform: translateX(-102%); transition: transform .25s;
    padding-top: calc(24px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
  body.open aside { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  body.open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.35); }
  main { padding-block: 20px 60px; }
  article { padding-top: 28px; border-radius: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="topbar">
  <button class="btn" id="menuBtn" aria-controls="side" aria-expanded="false">目次</button>
  <div class="t" id="topTitle">Claude Code の教科書</div>
</header>
<div class="shell">
  <aside id="side" aria-label="目次">
    <a class="brand" href="#top" data-route="top"><span class="k"><span>Claude Code</span> の教科書</span><span class="s">はじめての人のための全15章＋付録</span></a>
    <input class="search" id="q" type="search" placeholder="本文を検索（例: deny、/clear）" aria-label="本文を検索">
    <div class="progress" id="progress"><span id="progText">読んだ章 0 / 15</span><div class="bar"><i id="progBar"></i></div></div>
    <div id="results" class="results" hidden></div>
    <nav id="toc"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <article id="doc"></article>
    <div class="pager" id="pager"></div>
  </main>
</div>

<script type="application/json" id="docs">__DOCS__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  var DOCS = JSON.parse(document.getElementById('docs').textContent);
  var byFile = {}, byId = {};
  DOCS.forEach(function (d, i) { d.index = i; byFile[d.file] = d; byId[d.id] = d; });
  var chapters = DOCS.filter(function (d) { return d.kind === 'ch'; });

  // ---- storage (per-viewer convenience only) ----
  function loadDone() { try { return JSON.parse(localStorage.getItem('cc-textbook-done') || '{}') || {}; } catch (e) { return {}; } }
  function saveDone(v) { try { localStorage.setItem('cc-textbook-done', JSON.stringify(v)); } catch (e) {} }
  var done = loadDone();

  // ---- markdown ----
  function slug(raw) {
    return String(raw).trim().toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  marked.use({
    gfm: true,
    renderer: {
      heading: function (text, level, raw) {
        return '<h' + level + ' id="' + esc(slug(raw)) + '">' + text + '</h' + level + '>\n';
      },
      code: function (code, lang) {
        var l = (lang || '').trim().split(/\s+/)[0];
        return '<div class="code">' + (l ? '<span class="lang">' + esc(l) + '</span>' : '') +
          '<button class="btn copy" type="button">コピー</button><pre><code>' + esc(code) + '</code></pre></div>\n';
      },
      table: function (header, body) {
        return '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + body + '</tbody></table></div>\n';
      }
    }
  });

  function resolve(href) {
    // returns {id, anchor} for internal links, or null
    if (!href || /^[a-z]+:/i.test(href)) return null;
    var parts = href.split('#'), file = parts[0], anchor = parts[1] ? decodeURIComponent(parts[1]) : '';
    if (!file) return { id: null, anchor: anchor };
    file = file.replace(/^\.\//, '');
    var d = byFile[file];
    return d ? { id: d.id, anchor: anchor } : null;
  }

  var docEl = document.getElementById('doc');
  var pagerEl = document.getElementById('pager');
  var current = null;

  function render(id, anchor) {
    var d = byId[id] || byId.top;
    current = d;
    docEl.innerHTML = (d.part ? '<div class="eyebrow">' + esc(d.part) + '</div>' : '') + marked.parse(d.md);

    // decorate
    docEl.querySelectorAll('blockquote').forEach(function (bq) {
      var t = bq.textContent.trim();
      if (t.indexOf('この章で学ぶこと') === 0 || t.indexOf('この付録') === 0) bq.classList.add('goals');
      else if (/^注意/.test(t)) bq.classList.add('warn');
    });
    docEl.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
    });
    // remove markdown footer nav (replaced by pager)
    var last = docEl.lastElementChild;
    if (last && last.tagName === 'P' && /[←→]/.test(last.textContent) && last.querySelector('a')) {
      last.remove();
      var hr = docEl.lastElementChild; if (hr && hr.tagName === 'HR') hr.remove();
    }
    if (d.kind === 'ch') {
      var row = document.createElement('div');
      row.className = 'done-row';
      row.innerHTML = '<span class="hint">練習と確認テストまで終わったら、印を付けておきましょう。</span>' +
        '<button class="btn" type="button" id="doneBtn"></button>';
      docEl.appendChild(row);
      updateDoneBtn();
    }
    // pager
    var prev = DOCS[d.index - 1], next = DOCS[d.index + 1];
    pagerEl.innerHTML =
      (prev ? '<a class="prev" href="#' + prev.id + '"><small>← 前へ</small>' + esc(prev.short) + '</a>' : '<span></span>') +
      (next ? '<a class="next" href="#' + next.id + '"><small>次へ →</small>' + esc(next.short) + '</a>' : '<span></span>');

    document.getElementById('topTitle').textContent = d.short;
    markToc();
    if (anchor) {
      var t = document.getElementById(anchor);
      if (t) { t.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);
  }

  function updateDoneBtn() {
    var b = document.getElementById('doneBtn'); if (!b || !current) return;
    var on = !!done[current.id];
    b.textContent = on ? '✓ 読み終えた（取り消す）' : 'この章を読み終えた';
    b.className = on ? 'btn' : 'btn primary';
  }

  // ---- toc ----
  var tocEl = document.getElementById('toc');
  function buildToc() {
    var html = '', lastPart = null;
    DOCS.forEach(function (d) {
      if (d.id === 'top') { html += '<ol><li><a href="#top" data-id="top"><span class="n">◆</span><span>はじめに・目次</span><span class="ck"></span></a></li></ol>'; return; }
      if (d.part !== lastPart) { if (lastPart !== null) html += '</ol>'; html += '<div class="part">' + esc(d.part) + '</div><ol>'; lastPart = d.part; }
      html += '<li><a href="#' + d.id + '" data-id="' + d.id + '"><span class="n">' + esc(d.num) + '</span><span>' + esc(d.name) + '</span><span class="ck"></span></a></li>';
    });
    html += '</ol>';
    tocEl.innerHTML = html;
  }
  function markToc() {
    tocEl.querySelectorAll('a[data-id]').forEach(function (a) {
      var id = a.getAttribute('data-id');
      a.classList.toggle('cur', current && current.id === id);
      if (current && current.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      a.querySelector('.ck').textContent = done[id] ? '✓' : '';
    });
    var n = chapters.filter(function (c) { return done[c.id]; }).length;
    document.getElementById('progText').textContent = '読んだ章 ' + n + ' / ' + chapters.length;
    document.getElementById('progBar').style.width = (n / chapters.length * 100) + '%';
  }

  // ---- search ----
  var qEl = document.getElementById('q'), resEl = document.getElementById('results');
  DOCS.forEach(function (d) { d.plain = d.md.replace(/<[^>]+>/g, ' ').replace(/[#>*`|\[\]()_-]+/g, ' ').replace(/\s+/g, ' '); });
  qEl.addEventListener('input', function () {
    var q = qEl.value.trim();
    if (!q) { resEl.hidden = true; tocEl.hidden = false; return; }
    var ql = q.toLowerCase(), out = '';
    DOCS.forEach(function (d) {
      var low = d.plain.toLowerCase(), i = low.indexOf(ql);
      if (i < 0) return;
      var count = low.split(ql).length - 1;
      var s = Math.max(0, i - 30), snip = d.plain.slice(s, i + q.length + 50);
      var j = snip.toLowerCase().indexOf(ql);
      out += '<a href="#' + d.id + '" data-q="1"><b>' + esc(d.short) + '（' + count + '件）</b>' + (s > 0 ? '…' : '') +
        esc(snip.slice(0, j)) + '<mark>' + esc(snip.slice(j, j + q.length)) + '</mark>' + esc(snip.slice(j + q.length)) + '…</a>';
    });
    resEl.innerHTML = out || '<p class="none">「' + esc(q) + '」は見つかりませんでした。</p>';
    resEl.hidden = false; tocEl.hidden = true;
  });

  // ---- routing & clicks ----
  var pendingAnchor = null;
  function route() {
    var id = (location.hash || '#top').slice(1);
    if (!byId[id]) id = 'top';
    render(id, pendingAnchor); pendingAnchor = null;
    document.body.classList.remove('open');
    document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
  }
  document.addEventListener('click', function (e) {
    var copy = e.target.closest('.copy');
    if (copy) {
      var text = copy.parentElement.querySelector('code').textContent;
      var ok = function () { copy.textContent = 'コピーしました'; setTimeout(function () { copy.textContent = 'コピー'; }, 1600); };
      try {
        navigator.clipboard.writeText(text).then(ok, function () { selectCode(copy); });
      } catch (err) { selectCode(copy); }
      return;
    }
    if (e.target.id === 'doneBtn' && current) {
      done[current.id] = !done[current.id]; if (!done[current.id]) delete done[current.id];
      saveDone(done); updateDoneBtn(); markToc(); return;
    }
    var a = e.target.closest('a[href]');
    if (!a || !docEl.contains(a)) return;
    var r = resolve(a.getAttribute('href'));
    if (!r) return;
    e.preventDefault();
    if (r.id === null || (current && r.id === current.id)) {
      var t = r.anchor && document.getElementById(r.anchor); if (t) t.scrollIntoView({ behavior: 'smooth' });
      return;
    }
    pendingAnchor = r.anchor || null;
    if (location.hash === '#' + r.id) route(); else location.hash = r.id;
  });
  function selectCode(btn) {
    var el = btn.parentElement.querySelector('code');
    var range = document.createRange(); range.selectNodeContents(el);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    btn.textContent = '選択しました（Ctrl+C でコピー）';
  }
  document.getElementById('menuBtn').addEventListener('click', function () {
    var open = document.body.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.getElementById('scrim').addEventListener('click', function () { document.body.classList.remove('open'); });
  window.addEventListener('hashchange', route);

  buildToc();
  route();
})();
</script>
